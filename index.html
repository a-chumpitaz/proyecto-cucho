<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulario de 2 pasos</title>

    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f6f8;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      color: #1f2937;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #6b7280;
      font-size: 15px;
    }

    .steps {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
    }

    .step-indicator {
      flex: 1;
      height: 8px;
      border-radius: 999px;
      background: #e5e7eb;
    }

    .step-indicator.active {
      background: #2563eb;
    }

    .form-step {
      display: none;
    }

    .form-step.active {
      display: block;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #374151;
      font-weight: 600;
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      background: #2563eb;
      color: #ffffff;
      flex: 1;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #374151;
    }

    .success {
      display: none;
      padding: 16px;
      margin-top: 20px;
      border-radius: 10px;
      background: #ecfdf5;
      color: #047857;
      font-weight: 600;
    }

    .summary {
      display: none;
      margin-top: 18px;
      padding: 16px;
      border-radius: 10px;
      background: #f9fafb;
      color: #374151;
      font-size: 14px;
      line-height: 1.6;
    }

    @media (max-width: 520px) {
      .container {
        padding: 24px;
      }

      .buttons {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NS6DWDHS"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
  <main class="container">
    <h1>Registro de cliente</h1>
    <p class="subtitle">Completa tus datos en 2 pasos.</p>

    <div class="steps">
      <div class="step-indicator active" id="indicator1"></div>
      <div class="step-indicator" id="indicator2"></div>
    </div>

    <form id="multiStepForm">
      <!-- Paso 1 -->
      <section class="form-step active" id="step1">
        <div class="form-group">
          <label for="nombre">Nombres</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ej. Augusto" required />
        </div>

        <div class="form-group">
          <label for="apellido">Apellidos</label>
          <input type="text" id="apellido" name="apellido" placeholder="Ej. Chumpitaz" required />
        </div>

        <div class="form-group">
          <label for="documento">DNI</label>
          <input type="text" id="documento" name="documento" placeholder="Ej. 12345678" maxlength="8" required />
        </div>

        <div class="form-group">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" name="correo" placeholder="Ej. correo@dominio.com" required />
        </div>

        <div class="form-group">
          <label for="telefono">Celular</label>
          <input type="tel" id="telefono" name="telefono" placeholder="Ej. 999999999" required />
        </div>

        <div class="buttons">
          <button type="button" class="btn-primary" onclick="nextStep()">Continuar</button>
        </div>
      </section>

      <!-- Paso 2 -->
      <section class="form-step" id="step2">
        <div class="form-group">
          <label for="departamento">Departamento</label>
          <select id="departamento" name="departamento" required>
            <option value="">Selecciona una opción</option>
            <option value="Lima">Lima</option>
            <option value="Arequipa">Arequipa</option>
            <option value="Cusco">Cusco</option>
            <option value="La Libertad">La Libertad</option>
            <option value="Piura">Piura</option>
          </select>
        </div>

        <div class="form-group">
          <label for="provincia">Provincia</label>
          <input type="text" id="provincia" name="provincia" placeholder="Ej. Lima" required />
        </div>

        <div class="form-group">
          <label for="distrito">Distrito</label>
          <input type="text" id="distrito" name="distrito" placeholder="Ej. Miraflores" required />
        </div>

        <div class="form-group">
          <label for="direccion">Dirección</label>
          <input type="text" id="direccion" name="direccion" placeholder="Ej. Av. Principal 123" required />
        </div>

        <div class="form-group">
          <label for="referencia">Referencia</label>
          <input type="text" id="referencia" name="referencia" placeholder="Ej. Frente al parque" />
        </div>

        <div class="buttons">
          <button type="button" class="btn-secondary" onclick="previousStep()">Atrás</button>
          <button type="submit" class="btn-primary">Enviar</button>
        </div>
      </section>
    </form>

    <div class="success" id="successMessage">
      Formulario enviado correctamente.
    </div>

    <div class="summary" id="summary"></div>
  </main>

  <script>
    const step1 = document.getElementById("step1");
    const step2 = document.getElementById("step2");
    const indicator1 = document.getElementById("indicator1");
    const indicator2 = document.getElementById("indicator2");
    const form = document.getElementById("multiStepForm");
    const successMessage = document.getElementById("successMessage");
    const summary = document.getElementById("summary");

    function validateStep(stepElement) {
      const fields = stepElement.querySelectorAll("input, select");

      for (const field of fields) {
        if (!field.checkValidity()) {
          field.reportValidity();
          return false;
        }
      }

      return true;
    }

    function nextStep() {
      if (!validateStep(step1)) return;

      step1.classList.remove("active");
      step2.classList.add("active");
      indicator2.classList.add("active");
    }

    function previousStep() {
      step2.classList.remove("active");
      step1.classList.add("active");
      indicator2.classList.remove("active");
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      if (!validateStep(step2)) return;

      const data = new FormData(form);

      successMessage.style.display = "block";
      summary.style.display = "block";

      summary.innerHTML = `
        <strong>Resumen enviado:</strong><br>
        Nombre: ${data.get("nombre")} ${data.get("apellido")}<br>
        DNI: ${data.get("documento")}<br>
        Correo: ${data.get("correo")}<br>
        Celular: ${data.get("telefono")}<br>
        Dirección: ${data.get("direccion")}, ${data.get("distrito")}, ${data.get("provincia")}, ${data.get("departamento")}<br>
        Referencia: ${data.get("referencia") || "No indicada"}
      `;

      form.reset();
      previousStep();
    });
  </script>
</body>
</html>
